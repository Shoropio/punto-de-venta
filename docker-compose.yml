services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: pos
      MYSQL_USER: pos
      MYSQL_PASSWORD: pos_secret
      MYSQL_ROOT_PASSWORD: root_secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: base64:amOEiaqfBRrsUMLW+buIS2hT1wlPkSwruzZLMHFZy3o=
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: pos
      DB_USERNAME: pos
      DB_PASSWORD: pos_secret
      SANCTUM_STATEFUL_DOMAINS: localhost:5173,localhost:8080
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000/api
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mysql_data:
